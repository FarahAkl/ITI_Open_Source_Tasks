<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
    <title>Document</title>
  </head>
  <body class="form">
    <form
      action="index.html"
      method="post"
      class="form signup-form"
    >
      <table>
        <tr>
          <td>
            <img
              src="assets/icons8-male-user-50.png"
              alt="user"
            />
          </td>
        </tr>
        <tr>
          <td>
            <input
              type="text"
              name="user"
              placeholder="Enter your Username"
            />
          </td>
        </tr>
        <tr>
          <td>
            <img
              src="assets/mail.png"
              alt="mail"
            />
          </td>
        </tr>
        <tr>
          <td>
            <input
              type="email"
              name="mail"
              placeholder="Enter your Email"
            />
          </td>
        </tr>
        <tr>
          <td>
            <img
              src="assets\passs.png"
              alt="password"
            />
          </td>
        </tr>
        <tr>
          <td>
            <input
              type="password"
              name="pass"
              placeholder="Enter your Password"
            />
          </td>
        </tr>
        <tr>
          <td>
            <img
              src="assets\passs.png"
              alt="password"
            />
          </td>
        </tr>
        <tr>
          <td>
            <input
              type="password"
              name="confirm-pass"
              placeholder="Enter a password confirmation"
            />
          </td>
        </tr>
        <tr>
          <td><button type="submit">Sign Up</button></td>
        </tr>
      </table>
    </form>
  </body>
</html>
