<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
    <title>Document</title>
  </head>
  <body class="form">
    <form
      action="index.html"
      method="post"
      class="form login-form"
    >
      <table>
        <tr>
          <td>
            <img
              src="assets/icons8-male-user-50.png"
              alt="user"
            />
          </td>
        </tr>
        <tr>
          <td>
            <input
              type="text"
              name="user"
              placeholder="Enter your Username"
            />
          </td>
        </tr>
        <tr>
          <td>
            <img
              src="assets\passs.png"
              alt="password"
            />
          </td>
        </tr>
        <tr>
          <td>
            <input
              type="password"
              name="pass"
              placeholder="Enter you Password"
            />
          </td>
        </tr>
        <tr>
          <td>
            <button type="submit"><a href="index.html">Log In</a></button>
          </td>
        </tr>
        <tr>
          <td><a href="signup.html">sign up</a></td>
        </tr>
      </table>
    </form>
  </body>
</html>
