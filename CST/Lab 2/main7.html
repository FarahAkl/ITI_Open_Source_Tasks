<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
  </head>
  <body>
    <form>
      <table width="600">
        <tr>
          <td><label for="f-name">First name</label></td>
          <td>
            <input
              type="text"
              name="f-name"
              placeholder="First name"
              required
            />
          </td>
          <td><label for="l-name">Last name</label></td>
          <td>
            <input
              type="text"
              name="l-name"
              required
            />
          </td>
        </tr>
        <tr>
          <td><label for="BOD">Birth date</label></td>
          <td>
            <input
              type="date"
              name="BOD"
            />
          </td>
          <td><label for="gender">Gender</label></td>
          <td>
            <input
              type="radio"
              name="gender"
              value="male"
            />
            Male
            <input
              type="radio"
              name="gender"
              value="female"
            />
            Female
          </td>
        </tr>
        <tr>
          <td><label for="email">Email</label></td>
          <td>
            <input
              type="email"
              name="email"
              required
            />
          </td>
          <td><label for="phone">Phone</label></td>
          <td>
            <input
              type="tel"
              name="phone"
              required
            />
          </td>
        </tr>
        <tr>
          <td><label for="pass">Password</label></td>
          <td>
            <input
              type="password"
              name="pass"
              required
            />
          </td>
          <td><label for="website">Website</label></td>
          <td>
            <input
              type="text"
              name="website"
            />
          </td>
        </tr>
        <tr>
          <td>
            <label for="photo">Photo</label>
          </td>
          <td>
            <input
              type="file"
              name="photo"
            />
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
